name: Build tuanpc-desk Rust

on:
  push:
    branches: [main, codex/rust-test, codex/rust-dock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Rust native app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Kiểm tra SPI_SET tắt + SPI_GET xác nhận trên Windows thật. Runner
          # không có timer tương tác dùng trạng thái bật giả ở bước quyết định.
          cargo test --release lock::tests::saver_disable_applies_and_verifies_live_windows_state -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release shortcuts::tests::windows_conflict_restores_previous_registration -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release widget::tests::windows_clock_stays_below_apps_across_monitors -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release widget::tests::windows_clock_padding_preserves_position_when_resized_and_dragged -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release system_monitor::taskbar::tests::native_panel_recovers_visibility_geometry_and_shell_recreation -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/renderer-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/shortcuts-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Rust native build
        run: |
          $short = '${{ github.sha }}'.Substring(0, 7)
          $name = "tuanpc-desk-Rust-$short-win-x64"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\tuanpc-desk.exe "$dir\tuanpc-desk.exe"
          # Dùng giao diện prototype hiện tại để có panorama, công tắc thời
          # gian/thời tiết và tìm vị trí; engine Rust nhận các message tương ứng.
          Copy-Item -Recurse prototype "$dir\prototype"
          Copy-Item -Recurse assets\widget "$dir\assets\widget"
          foreach ($file in 'README.md','LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','TRADEMARKS.md') {
            if (Test-Path $file) { Copy-Item $file $dir }
          }
          Copy-Item README-rust.md "$dir\README-rust.md"
          '${{ github.sha }}' | Set-Content "$dir\BUILD-COMMIT.txt" -Encoding ascii
          @"
          tuanpc-desk Rust Native build

          Giải nén toàn bộ thư mục này và chạy tuanpc-desk.exe.
          Giữ thư mục prototype cạnh file exe để mở Cài đặt.
          Bản này dùng engine Rust + Win32 + OpenGL, một tiến trình native.
          "@ | Set-Content "$dir\DOC-TRUOC.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -Encoding ascii

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuanpc-desk-Rust-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
            Cargo.lock
          retention-days: 14

