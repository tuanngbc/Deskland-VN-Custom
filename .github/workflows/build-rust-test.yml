name: Build TLauncher Rust

on:
  push:
    branches: [main, codex/rust-dock]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Rust native app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseErrors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/owner-resource-diagnostics.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          cargo test --release dock::motion::tests::live_speed_reaches_both_ui_threads_without_restarting_active_tweens -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::glass_menu::tests::native_menu_prepares_frame_and_uses_all_six_speeds -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Isolated same-process HWND/thread test; never loads the owner's profile.
          # This is CI integration evidence, not Windows 11 dual-monitor acceptance.
          cargo test --release dock::runtime::tests::native_integrated_modules_toggle_suspend_and_cleanup -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUANPC_DESK_STAGE_EVIDENCE = Join-Path $env:RUNNER_TEMP "stage-fixture-evidence"
          cargo test --release dock::stage_capture_lab::native_stage_worker_keeps_independent_frames_through_minimize -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::runtime::tests::native_100_toggles_release_overlays_and_process_handles -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::runtime::tests::native_appbar_fatal_exit_restores_work_area -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::appbar::tests::native_keeps_dock_when_stage_changes_edges_and_rebinds -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::runtime::tests::native_display_targets_filter_hwnds_and_keep_other_module -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::runtime::tests::native_startup_never_synchronously_reads_own_settings_title -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::runtime::tests::native_registered_settings_identity_state_and_pins -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_surface::tests::native_region_clips_desktop_gaps_and_preserves_thumbnail_slots -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_surface::tests::native_stage_surface_submits_premultiplied_cards_with_desktop_gaps -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_surface::perspective_lab::native_fixture_dibs_are_projected_into_stage_stack -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_surface::perspective_lab::native_stage_aa_comparison_at_three_dpi -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_capture_lab::native_wgc_projects_one_owned_hwnd_or_reports_blocked -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_capture_lab::native_scale_proxy_owned_source_100_cycles -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::stage_surface::tests::native_slide_keeps_live_preview_host_aligned_without_activating_either_window -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUANPC_DESK_STAGE_COMPOSITION_LAB = '1'
          cargo test --release dock::previews::native_tests::native_preview_relationships_survive_switches_and_release -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:TUANPC_DESK_STAGE_COMPOSITION_LAB
          cargo test --release dock::control_center::tests::native_popup_has_its_first_layer_before_pumping_input -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release web::tests::coordinator_enumerates_one_settings_hwnd_across_failure_and_reopen -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUANPC_DESK_CALENDAR_EVIDENCE = Join-Path $env:RUNNER_TEMP "calendar-evidence"
          cargo test --release dock::calendar::tests::native_calendar_navigates_and_presents_light_dark_months -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::taskbar_guard::tests::native_visibility_request_hides_a_window_without_moving_it -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUANPC_DESK_START_EVIDENCE = Join-Path $env:RUNNER_TEMP "start-native.png"
          cargo test --release launcher::start::tests::native_panel_search_keyboard_and_anchor_are_independent_of_spotlight -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Private Win32 desktop with synthetic app names; never switches the input desktop.
          $env:TUANPC_SPOTLIGHT_EVIDENCE = Join-Path $env:RUNNER_TEMP "spotlight-evidence"
          New-Item -ItemType Directory -Force $env:TUANPC_SPOTLIGHT_EVIDENCE | Out-Null
          cargo test --release launcher::fullscreen::native_tests::native_live_backdrop_retains_color_and_filters_detail -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release launcher::fullscreen::native_tests::native_actual_search_field_screen_output -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release launcher::fullscreen::native_tests::native_repeated_live_graphics_reuses_factories_without_retaining_surfaces -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release launcher::fullscreen::native_tests::native_activation_modes_apply_live_on_one_overlay -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release launcher::fullscreen::native_tests::native_isolated_library_search_navigation_and_100_toggles -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUANPC_DESK_TYPE_EVIDENCE = Join-Path $env:RUNNER_TEMP "typography-evidence"
          cargo test --release native_text::tests::grayscale_typography_sheet_at_96_120_144 -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::win_key::tests::native_hook_thread_installs_and_unhooks_without_synthetic_keys -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::command_pin::tests::native_shell_launch_passes_arguments_and_working_directory -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release dock::utilities::tests::native_on_demand_provider_completes_without_an_assumed_device -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($attempt in 1..3) {
            cargo test --release dock::workspaces::tests::native_stage_switch_restores_placement_and_ignores_unmanaged_windows -- --ignored --exact --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --release integration_tests::native_explorer_restart_queues_recovery_without_settings_writes -- --ignored --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Kiểm tra SPI_SET tắt + SPI_GET xác nhận trên Windows thật. Runner
          # không có timer tương tác dùng trạng thái bật giả ở bước quyết định.
          cargo test --release lock::tests::saver_disable_applies_and_verifies_live_windows_state -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release shortcuts::tests::windows_conflict_restores_previous_registration -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release widget::tests::windows_clock_stays_below_apps_across_monitors -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release widget::tests::windows_clock_padding_preserves_position_when_resized_and_dragged -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release system_monitor::taskbar::tests::native_panel_recovers_visibility_geometry_and_shell_recreation -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/trial-isolation.ps1 -Exe (Resolve-Path target/release/TLauncher.exe).Path
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/owner-uat-contract.ps1 -Exe (Resolve-Path target/release/TLauncher.exe).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/renderer-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/shortcuts-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/dock-settings-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/dock-benchmark-contract.ps1
          ./tests/dock-fixture-native.ps1
          ./tests/cooperative-tray-poc.ps1 -Exe (Resolve-Path target/release/TLauncher.exe).Path

      - name: Package Rust native build
        run: |
          $short = '${{ github.sha }}'.Substring(0, 7)
          $version = (Get-Item target\release\TLauncher.exe).VersionInfo.ProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid executable version: $version" }
          $cargoVersion = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'tlauncher' | Select-Object -ExpandProperty version
          if ($version -cne $cargoVersion) { throw "TLauncher.exe version $version does not match Cargo $cargoVersion" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match TLauncher.exe $version" }
            $name = "TLauncher-$version-win-x64"
          } else {
            $name = "TLauncher-Rust-$short-win-x64"
          }
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\TLauncher.exe "$dir\TLauncher.exe"
          # Dùng giao diện prototype hiện tại để có panorama, công tắc thời
          # gian/thời tiết và tìm vị trí; engine Rust nhận các message tương ứng.
          Copy-Item -Recurse prototype "$dir\prototype"
          Copy-Item -Recurse assets\widget "$dir\assets\widget"
          foreach ($file in 'README.md','CHANGELOG.md','LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','TRADEMARKS.md') {
            if (Test-Path $file) { Copy-Item $file $dir }
          }
          Copy-Item README-rust.md "$dir\README-rust.md"
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Copy-Item tools\owner-uat.ps1 "$dir\owner-uat.ps1"
            Copy-Item docs\unified-spotlight.md "$dir\UAT-SPOTLIGHT.md"
            Copy-Item docs\TLAUNCHER_RESOURCE_OPTIMIZATION_REPORT.md "$dir\UAT-RESOURCE.md"
            Copy-Item tools\owner-resource-diagnostics.ps1 "$dir\owner-resource-diagnostics.ps1"
            Copy-Item tools\REPORT-RESOURCE.cmd "$dir\REPORT-RESOURCE.cmd"
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP "start-native.png") "$dir\START-NATIVE-CI.png"
          $version | Set-Content "$dir\VERSION.txt" -Encoding ascii
          '${{ github.sha }}' | Set-Content "$dir\BUILD-COMMIT.txt" -Encoding ascii
          @"
          TLauncher Rust Native build

          Giải nén toàn bộ thư mục này và chạy TLauncher.exe.
          Giữ thư mục prototype cạnh file exe để mở Cài đặt.
          Bản này dùng engine Rust + Win32 + OpenGL. Dock và Stage Manager
          được quản lý trong cùng TLauncher.exe, bật riêng trong Cài đặt.
          Khi bật Dock, TLauncher ưu tiên chế độ ẩn thanh Windows. Có thể chọn Tương thích Windows trong Cài đặt.
          "@ | Set-Content "$dir\DOC-TRUOC.txt" -Encoding utf8
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            @"
          TLauncher Windows TEST candidate.
          Start only with the TLauncher 1.0.2 TEST Desktop shortcut configured for this verified package.
          Do not run TLauncher.exe directly: the shortcut selects the isolated TEST profile.
          Exit TLauncher from its menu and leave the launcher window open until production is restored.
          "@ | Set-Content "$dir\DOC-TRUOC.txt" -Encoding utf8
          }
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -Encoding ascii
          Write-Host "CANDIDATE_PACKAGE version=$version commit=${{ github.sha }} sha256=$hash"

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLauncher-Rust-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
            Cargo.lock
          retention-days: 14

      - name: Upload native visual fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-fixtures
          path: |
            ${{ runner.temp }}/stage-fixture-evidence/*.png
            ${{ runner.temp }}/stage-fixture-evidence/stage-wgc-result.txt
            ${{ runner.temp }}/stage-fixture-evidence/stage-external-fixture-result.txt
            ${{ runner.temp }}/start-native*.png
            ${{ runner.temp }}/typography-evidence/*.png
            ${{ runner.temp }}/spotlight-evidence/*.png
            ${{ runner.temp }}/calendar-evidence/*.png
          if-no-files-found: error
          retention-days: 14
