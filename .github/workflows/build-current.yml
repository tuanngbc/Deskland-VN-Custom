name: Build current Deskland Preview

on:
  push:
    branches: [main, codex/rust-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build current C# host
        run: powershell -ExecutionPolicy Bypass -File host\build.ps1

      - name: Package current build
        run: |
          $version = (Get-Content tools\version.json -Raw | ConvertFrom-Json).version
          $name = "Deskland-VN-current-$version-win-x64"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse host\bin $dir\bin
          Copy-Item -Recurse prototype $dir\prototype
          Remove-Item "$dir\prototype\serve.mjs" -ErrorAction SilentlyContinue
          foreach ($file in 'README.md','LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','TRADEMARKS.md') {
            if (Test-Path $file) { Copy-Item $file $dir }
          }
          @"
          Deskland Preview $version (current Git build)

          Giải nén toàn bộ thư mục này và chạy bin\Deskland.exe.
          Giữ thư mục prototype cạnh thư mục bin để mở giao diện Cài đặt đầy đủ.
          Bản build này chứa các cập nhật mới nhất trên nhánh main.
          "@ | Set-Content "$dir\DOC-TRUOC.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskland-VN-current-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
